function render(){const q=search.value.trim();const list=lessons.filter(l=>(l.character+l.title+l.description+l.keywords).includes(q));cards.innerHTML=list.map(l=>'<a class="card '+esc(l.color)+'" href="'+esc(l.url)+'" aria-label="進入'+esc(l.character)+'字學習任務"><div class="art"><img class="glyph" src="'+esc(l.image)+'" alt="'+esc(l.character)+'字楷書" width="123" height="123"><div class="ribbon"><div class="char">'+esc(l.character)+'</div><div class="pron">'+esc(l.pronunciation)+'</div><small>字形觀察 × 互動闖關</small></div></div><div class="content"><h2>'+esc(l.title)+'</h2><p>'+esc(l.description)+'</p><div class="tags"><span>看圖排序</span><span>提示與鼓勵</span><span>回饋給老師</span></div><div class="enter"><span>開始探險</span><span aria-hidden="true">→</span></div></div></a>').join('');document.getElementById('count').textContent=q?'找到 '+list.length+' 個任務':'已開放 '+lessons.length+' 個字源任務';document.getElementById('empty').hidden=!!list.length;}
search.addEventListener('input',render);document.getElementById('clear').onclick=()=>{search.value='';render();search.focus();};document.getElementById('random').onclick=()=>{if(lessons.length)location.href=lessons[Math.floor(Math.random()*lessons.length)].url;};render();
</script></body></html>
