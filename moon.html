{type:'choice',area:'觀察小偵探',title:'比較古代和現在的「月」字，哪個說法合適？',visual:'月',sub:'回想影片中，字形怎麼變了。',options:['每個時代都寫得完全一樣','從像圖畫的外形，慢慢變成較規整的筆畫','只要形狀改變，就不能表示月亮'],answer:1,hint:'想一想：早期像畫出月亮，現在則用筆畫來寫。',explain:'沒錯！字形改變了，「月」仍可以表示月亮。你看出了演變的重點！'},

{type:'choice',area:'朝字的早安',title:'「朝陽」的「朝」，在這裡是什麼意思？',visual:'朝',sub:'朝陽：ㄓㄠ ㄧㄤˊ',options:['早晨','深夜','中午'],answer:0,hint:'朝陽是早晨的太陽。注意這裡的「朝」讀ㄓㄠ。',explain:'答對了！「朝陽」指早晨的太陽，這裡的「朝」表示早晨，讀ㄓㄠ。'},
{type:'choice',area:'月光組字站',title:'哪個字有「月」，也可以表示明亮？',visual:'月',sub:'想一想：明＿＿、晴＿＿。',options:['浪','朗','狼'],answer:1,hint:'看右邊的部件！「朗」的右邊是「月」；「浪」有水旁，「狼」有犬旁。',explain:'你找到「朗」了！朗讀ㄌㄤˇ，有明亮的意思，像「明朗」「晴朗」。'},
{type:'choice',area:'聲音線索站',title:'「朗」字中的「良」聲旁，主要提供什麼線索？',visual:'朗',sub:'良 ㄌㄧㄤˊ　／　朗 ㄌㄤˇ',options:['告訴我們字有幾筆','告訴我們字的顏色','幫助我們聯想讀音'],answer:2,hint:'「聲旁」的「聲」就是聲音。注意：良和朗的讀音不完全一樣。',explain:'很會找線索！良是聲旁，能幫助聯想讀音，但良和朗不完全同音。寫「朗」時，左邊是良的變形，要看清楚完整字形。'},
{type:'choice',area:'語詞小達人',title:'「今天沒有烏雲，天空很＿＿。」哪個詞最合適？',visual:'☀️',sub:'讀完句子，再選一選。',options:['晴朗','月亮','朝陽'],answer:0,hint:'空格需要描述天空的樣子。「晴朗」是天空明亮、沒有或很少雲的樣子。',explain:'成功！「天空很晴朗」讀起來通順，也符合句子的意思。你會把新詞用進句子了！'}

let current=0,records=[],attempts=0,hinted=false,solved=false,order=[],soundOn=false,feeling='',ctx;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateMap(){ $('stops').innerHTML=questions.map((_,i)=>'<span class="stop '+(i<records.length?'done':i===current?'active':'')+'" '+(i===current?'aria-current="step"':'')+'>'+ (i<records.length?'★':i+1)+'</span>').join('');$('progress').value=records.length;$('count').textContent='已收集 '+records.length+' / 8 顆星';}
function render(){updateMap();attempts=0;hinted=false;solved=false;order=[];if(current>=questions.length){finish();return}const q=questions[current];$('step').textContent='任務 '+(current+1)+' / 8';$('game').innerHTML='<div class="eyebrow">'+q.area+'</div><h2 id="question" tabindex="-1">'+q.title+'</h2>'+(q.type==='order'?'<p class="muted">從古到今，依序點選下方的字形圖卡。點錯可按「重排」。</p><div class="visual"><div class="sequence" id="sequence" aria-live="polite"></div></div><div id="orderchoices" class="glyph-options"></div>'+glyphSource():visualFor(q)+'<div class="choices">'+q.options.map((o,i)=>'<button class="choice" data-answer="'+i+'"><span class="label">'+String.fromCharCode(65+i)+'</span>'+o+'</button>').join('')+'</div>')+'<div class="actions"><button class="btn" id="hint">💡 給我提示</button><button class="btn" id="speak">🔊 聽題目</button>'+(q.type==='order'?'<button class="btn" id="guide" aria-expanded="false" aria-controls="glyphGuide">🔎 看字形圖鑑</button><button class="btn" id="clear">↻ 重排</button><button class="btn primary" id="check">檢查順序</button>':'')+'</div>'+(q.type==='order'?'<div id="glyphGuide" class="glyph-guide" hidden><h3>先觀察，再挑戰</h3><p>這次排序的五種字體：</p><div class="glyph-gallery">'+q.correct.map(n=>glyph(n)).join('')+'</div><p class="small">漢典還列出下方兩類字形，一起看看！</p><div class="glyph-gallery">'+glyph('楚系簡帛')+glyph('秦系簡牘')+'</div><p class="small muted">這些是不同材料上的字形例子，不必把所有類別硬排成一條時間線。同一種字體也可能有不同寫法。</p></div>':'')+'<div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="btn primary" id="next" hidden>'+(current===7?'領取月光獎章 ✦':'下一個任務 →')+'</button></div>';
$('hint').onclick=()=>{if(!solved)hinted=true;feedback('💡 '+q.hint,'');};$('speak').onclick=()=>speak(q);$('next').onclick=()=>{stopSpeak();current++;render();($('question')||$('resultTitle')).focus();};if(q.type==='order'){renderOrder();$('guide').onclick=showGlyphGuide;$('clear').onclick=()=>{if(!solved){order=[];renderOrder();feedback('重新想一想，慢慢排就好。','');}};$('check').onclick=checkOrder;}else document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer),b));}
function feedback(msg,kind){$('feedback').className='feedback '+kind;$('feedback').textContent=msg;}
function answer(i,b){if(solved)return;attempts++;const q=questions[current];if(i===q.answer){b.classList.add('right');document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);complete(q);}else{b.classList.add('wrong');b.disabled=true;feedback('🌱 還差一點！'+q.hint+' 再選一次，你正在學會。','try');tone(false);}}
function renderOrder(){const q=questions[current];$('sequence').innerHTML=Array.from({length:5},(_,i)=>'<span class="slot"><span class="slot-number">'+(i+1)+'</span>'+(order[i]?glyph(order[i]):'<span class="empty-slot">？</span>')+'</span>').join('');$('orderchoices').innerHTML=q.items.map(s=>'<button class="orderbutton" data-item="'+s+'" aria-label="選擇'+s+'的月字圖片" '+(order.includes(s)||solved?'disabled':'')+'>'+glyph(s)+(order.includes(s)?'<span class="placed">已放入 '+(order.indexOf(s)+1)+'</span>':'<span class="pick-label">點我選入</span>')+'</button>').join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{order.push(b.dataset.item);renderOrder();});$('check').disabled=order.length!==5||solved;}
function checkOrder(){if(solved||order.length!==5)return;attempts++;const q=questions[current];if(order.every((s,i)=>s===q.correct[i])){complete(q);$('clear').disabled=true;renderOrder();}else{feedback('🌱 '+q.hint+' 按「重排」，再試一次！','try');tone(false);}}
function complete(q){solved=true;records.push({area:q.area,status:attempts>1?'再試後完成':hinted?'看提示完成':'自己完成',attempts,hinted});updateMap();feedback('⭐ 收到一顆月光星！'+q.explain,'ok');$('next').hidden=false;$('hint').disabled=true;tone(true);celebrate();}
function stopSpeak(){if('speechSynthesis'in window)window.speechSynthesis.cancel();}
function speak(q){if(!('speechSynthesis'in window)){feedback('這台裝置目前沒有朗讀功能，請老師或同學陪你讀題目。','');return}stopSpeak();const words=q.title+'。'+(q.options?q.options.map((s,i)=>String.fromCharCode(65+i)+'，'+s).join('。'):'依照古到今的順序點選字體。');const u=new SpeechSynthesisUtterance(words);u.lang='zh-TW';u.rate=.8;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='zh-TW')||voices.find(v=>v.lang.startsWith('zh'));if(voice)u.voice=voice;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled'&&$('feedback'))feedback('朗讀暫時無法播放，請老師陪你讀一讀。','');};speechSynthesis.speak(u);}
function tone(good){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[good?523:330,good?659:392,good?784:440].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.connect(g);g.connect(ctx.destination);o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2);});}catch(e){soundOn=false;$('sound').textContent='♫ 音效無法使用';$('sound').setAttribute('aria-pressed','false');}}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<9;i++){const e=document.createElement('span');e.className='confetti';e.textContent=['⭐','✦','✨'][i%3];e.style.setProperty('--x',(Math.random()*440-220)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1500);}}
function finish(){updateMap();$('step').textContent='任務完成・我的學習回饋';const own=records.filter(r=>r.status==='自己完成').length;const support=records.length-own;$('game').innerHTML='<div class="print-title">漢字說故事 第 24 集〈月〉・學習紀錄</div><div style="text-align:center"><div class="badge">🏅</div><div class="eyebrow">月光探險家</div><h2 id="resultTitle" tabindex="-1">你把 8 顆月光星找回來了！</h2><p>願意觀察、想一想、再試一次，<br>就是學習的超能力。</p></div><div class="metrics"><div class="metric"><strong>8 / 8</strong>任務完成</div><div class="metric"><strong>'+own+'</strong>自己完成</div><div class="metric"><strong>'+support+'</strong>練習後完成</div></div><h3>我的學習足跡</h3><ul class="review">'+records.map((r,i)=>'<li><span class="pill">'+r.status+'</span> '+(i+1)+'. '+r.area+'</li>').join('')+'</ul><h3>把回饋寄給老師</h3><div class="identity-fields"><label>班級<input id="classroom" maxlength="24" placeholder="例如：二年三班" autocomplete="off"></label><label>座號<input id="seat" type="number" min="1" max="60" inputmode="numeric" placeholder="例如：12" autocomplete="off"></label></div><div class="honeypot" aria-hidden="true"><label>留空<input id="website" tabindex="-1" autocomplete="off"></label></div><p class="small muted">不用填姓名或電子信箱。送出後，老師會收到你的班級、座號、感受、留言和闖關紀錄。</p><h3>現在的我……</h3><div class="feelings" role="group" aria-label="我的學習感受"><button data-feeling="我可以說給別人聽">😊 我會說明</button><button data-feeling="我想再練一次">🌱 我想再練</button><button data-feeling="我想請老師幫忙">🙋 我想問老師</button></div><p id="feelingReply" role="status"></p><label for="reflection"><strong>我發現／我還想問……</strong></label><p class="small muted">例如：月亮像＿＿；我發現「朗」＿＿。可以打字，也可以說給老師聽。</p><textarea id="reflection" maxlength="300" placeholder="寫下你的發現或問題……"></textarea><div class="actions no-print"><button class="btn primary" id="saveReflection">📨 寄給老師</button><button class="btn" id="print">列印／存成 PDF</button><button class="btn" id="again">再探險一次</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><p class="small muted">送出時需要網路。看到「已交給寄信服務」表示系統已受理；老師可能需要稍候或檢查垃圾郵件。</p>';
document.querySelectorAll('[data-feeling]').forEach(b=>b.onclick=()=>{feeling=b.dataset.feeling;document.querySelectorAll('[data-feeling]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});$('feelingReply').textContent=feeling==='我可以說給別人聽'?'試著說說：月字像什麼？朗可以組什麼詞？':feeling==='我想再練一次'?'願意再試很棒！可以和同學討論剛才需要提示的題目。':'會提問也是學習！把想問的地方寫下來，或直接說給老師聽。';});$('saveReflection').onclick=sendToTeacher;$('print').onclick=()=>window.print();$('again').onclick=restart;}
function restart(){if(mailState==='sending'){feedback('正在寄送，請等候結果再重新挑戰。','try');return;}if(!confirm('要重新挑戰嗎？這一輪的紀錄和回饋會清除。'))return;stopSpeak();resetMail();current=0;records=[];feeling='';render();$('question').focus();}
const GAS_CONFIG = JSON.parse(document.getElementById('gas-config').textContent);
let submission = null, mailState = 'idle', mailTimer = null, mailFrame = null;
function validGasEndpoint(value) { try { const u=new URL(value); return u.protocol==='https:' && u.hostname==='script.google.com' && /^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname) && !u.search && !u.hash; } catch(e) { return false; } }
function randomId() { const bytes=new Uint8Array(16); crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join(''); }
function freezeFeedback(frozen) { ['classroom','seat','reflection'].forEach(id=>{if($(id))$(id).disabled=frozen;});document.querySelectorAll('[data-feeling]').forEach(b=>b.disabled=frozen); }
function sendToTeacher(){
 if(mailState==='sending'||mailState==='sent'||mailState==='uncertain')return;
 if(!validGasEndpoint(GAS_CONFIG.endpoint)){feedback('老師還在設定收信功能。你的內容還在，請先給老師看或列印保存。','try');return;}
 if(location.protocol!=='https:'){feedback('寄信需要從正式的 GitHub Pages 網址開啟。請老師協助；本機檔仍可練習及列印。','try');return;}
 if(!submission){
  const classroom=$('classroom').value.trim(),seat=Number($('seat').value);
  if(!classroom||classroom.length>24){feedback('請填上班級。','try');$('classroom').focus();return;}
  if(!Number.isInteger(seat)||seat<1||seat>60){feedback('請填上你的座號（1～60）。','try');$('seat').focus();return;}
  if(!feeling){feedback('先選一個現在的學習感受吧！','try');return;}
  if(records.length!==8){feedback('請先完成全部任務。','try');return;}
  submission={lesson:'moon-v1',requestId:randomId(),nonce:randomId(),returnOrigin:location.origin,classroom,seat,feeling,reflection:$('reflection').value.trim(),records:records.map(r=>({attempts:r.attempts,hinted:r.hinted})),website:$('website').value};
 }
 submission.nonce=randomId();mailState='sending';freezeFeedback(true);$('saveReflection').disabled=true;$('saveReflection').textContent='傳送中，請稍候…';feedback('📨 正在把你的學習回饋交給老師，請先留在這一頁。','');
 if(mailFrame)mailFrame.remove();mailFrame=document.createElement('iframe');mailFrame.name='gu_mail_'+submission.requestId;mailFrame.hidden=true;mailFrame.title='傳送學習回饋';mailFrame.dataset.mailTransient='true';document.body.appendChild(mailFrame);
 const form=document.createElement('form');form.method='POST';form.action=GAS_CONFIG.endpoint;form.target=mailFrame.name;form.hidden=true;form.dataset.mailTransient='true';
 const payload=document.createElement('input');payload.type='hidden';payload.name='payload';payload.value=JSON.stringify(submission);form.appendChild(payload);document.body.appendChild(form);
 clearTimeout(mailTimer);mailTimer=setTimeout(()=>{if(mailState!=='sending')return;mailState='timeout';$('saveReflection').disabled=false;$('saveReflection').textContent='再次確認寄送狀態';feedback('還沒有收到寄送確認，這不表示寄送失敗。內容已保留；按「再次確認」會使用同一筆識別碼，或請老師查收信箱。','try');},45000);
 try{form.submit();}catch(e){clearTimeout(mailTimer);mailState='timeout';$('saveReflection').disabled=false;$('saveReflection').textContent='再次確認寄送狀態';feedback('傳送目前無法確認。請檢查網路後再次確認，內容仍保留。','try');}finally{form.remove();}
}
window.addEventListener('message',event=>{
 const trusted = event.origin==='https://script.google.com'||/^https:\/\/(?:script|[a-z0-9-]+-script)\.googleusercontent\.com$/.test(event.origin);
 const d=event.data;
 if(!trusted||!submission||!d||d.type!=='gu-feedback-v1'||d.requestId!==submission.requestId||d.nonce!==submission.nonce)return;
 if(!['sent','uncertain','retry','error'].includes(d.status))return;
 clearTimeout(mailTimer);mailState=d.status;
 if(d.status==='sent'){$('saveReflection').disabled=true;$('saveReflection').textContent='✓ 已交給寄信服務';feedback('💌 '+d.message,'ok');celebrate();}
 else if(d.status==='uncertain'){$('saveReflection').disabled=true;$('saveReflection').textContent='請老師確認收信';feedback(d.message,'try');}
 else if(d.status==='retry'){$('saveReflection').disabled=false;$('saveReflection').textContent='再次確認寄送狀態';feedback(d.message,'try');}
 else {submission=null;freezeFeedback(false);$('saveReflection').disabled=false;$('saveReflection').textContent='📨 寄給老師';feedback(d.message,'try');}
});
function resetMail(){clearTimeout(mailTimer);if(mailFrame)mailFrame.remove();mailFrame=null;submission=null;mailState='idle';}


$('restart').onclick=restart;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='♫ 音效：'+(soundOn?'開':'關');$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(true);};render();
</script></body></html>
