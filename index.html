<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>認識字源首頁｜字源探險基地</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#354a85,transparent 65%),#101b36;color:#f7f9ff;font:clamp(22px,2vw,32px)/1.6 "Microsoft JhengHei",sans-serif}header,main,footer{max-width:1550px;margin:auto;padding:24px 4vw}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{color:#9fe9e1;font-weight:bold}h1{font-size:clamp(38px,4vw,68px);line-height:1.25;margin:20px 0}p{color:#d0dcf7}.hero{padding:20px 0}.hero strong{color:#ffe28b}button,input,a{font:inherit;touch-action:manipulation}button{cursor:pointer;background:#ffe28b;color:#17233f;border:0;border-radius:16px;padding:14px 20px;min-height:64px;font-weight:bold}input{background:#223557;color:white;border:2px solid #8b9fc5;border-radius:16px;padding:15px;width:100%;min-height:64px}button:focus-visible,a:focus-visible,input:focus-visible{outline:5px solid #ffcf64;outline-offset:4px}.tools{display:flex;gap:15px;align-items:end;flex-wrap:wrap}.search{flex:1;min-width:220px}.search label{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.card{border:3px solid #879fc8;border-radius:26px;padding:20px;background:#213653;text-decoration:none;color:white;display:flex;flex-direction:column;align-items:center;min-height:310px;transition:transform .15s}.card:hover{transform:translateY(-4px);border-color:#ffe28b;background:#2e4770}.char{font-family:"DFKai-SB","KaiTi",serif;font-size:110px;line-height:1.3;color:#ffe28b}.words{font-size:23px;color:#d4e2fa;text-align:center}.enter{margin-top:auto;padding-top:12px;color:#a6f2e1;font-weight:bold}.future{border:2px dashed #7188b2;padding:24px;border-radius:24px;margin-top:28px}footer{font-size:20px;color:#b8c9eb}#empty{padding:28px;background:#243a61;border-radius:20px}[hidden]{display:none!important}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px;min-height:260px}.char{font-size:90px}.words{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><header><span class="brand">✦ 字源探險基地</span><button id="full">⛶ 全螢幕</button></header><main><div class="hero"><div>看字形・找線索・勇敢試一試</div><h1>每個字，<strong>都有故事！</strong></h1><p>選一個字，搭上字形時光機。<br>看影片、找字朋友，再挑戰小任務！</p></div><div class="tools"><div class="search"><label for="search">今天想認識哪個字？</label><input id="search" placeholder="輸入：水、眼、森林……" type="search"></div><button id="clear">顯示全部</button><button id="random">✨ 幫我選一個字</button></div><p id="count" role="status"></p><div id="cards" class="cards"></div><div id="empty" hidden>還找不到這個字，試試其他字，或按「顯示全部」。</div><div class="future">🚀 更多字源故事，未來陸續加入！<br>今天又發現了什麼？說給同學聽吧。</div></main><footer>認識字源首頁 · 12 個主題 · 不比速度，仔細觀察就是進步。</footer><script>
// 未來新增課程：在 lessons 加入 {character:'字',url:'W013.html',words:'延伸字'}，並上傳對應檔案。
const lessons=[{"character": "古", "url": "gu.html", "words": "姑、枯、故"}, {"character": "月", "url": "moon.html", "words": "朝、朗"}, {"character": "又", "url": "W003.html", "words": "友、最、及"}, {"character": "木", "url": "W004.html", "words": "林、休、森"}, {"character": "口", "url": "W005.html", "words": "鳴、召、咬"}, {"character": "力", "url": "W006.html", "words": "幼、協、勇"}, {"character": "人", "url": "W007.html", "words": "從、比、休"}, {"character": "日", "url": "W008.html", "words": "旦、旺、時"}, {"character": "大", "url": "W009.html", "words": "夫、天、美"}, {"character": "土", "url": "W010.html", "words": "坐、肚、吐"}, {"character": "水", "url": "W011.html", "words": "泉、汗、洗"}, {"character": "目", "url": "W012.html", "words": "眉、相、眼"}];
const cards=document.getElementById('cards'),search=document.getElementById('search');
function matching(){return lessons.filter(l=>(l.character+l.words).includes(search.value.trim()))}
function render(){const list=matching();cards.replaceChildren();for(const l of list){const a=document.createElement('a');a.className='card';a.href=l.url;a.setAttribute('aria-label','進入'+l.character+'字學習');for(const [cls,txt] of [['char',l.character],['words',l.words],['enter','開始探險 →']]){const el=document.createElement('span');el.className=cls;el.textContent=txt;a.append(el)}cards.append(a)}document.getElementById('count').textContent='找到 '+list.length+' 個字源任務';document.getElementById('empty').hidden=!!list.length;document.getElementById('random').disabled=!list.length}
search.oninput=render;document.getElementById('clear').onclick=()=>{search.value='';render();search.focus()};document.getElementById('random').onclick=()=>{const l=matching();if(l.length)location.href=l[Math.floor(Math.random()*l.length)].url};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('full').textContent='請按 F11 全螢幕'}};render();
</script></body></html>
